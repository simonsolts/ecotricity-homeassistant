[project]
name = "ecotricity-homeassistant"
version = "0.1.0"
description = "Unofficial Home Assistant integration for Ecotricity (UK)"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.ecotricity"]

[tool.pyright]
venvPath = "."
venv = ".venv314"
