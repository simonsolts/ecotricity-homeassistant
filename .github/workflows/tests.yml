name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  pytest:
    name: Pytest (Home Assistant ${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The minimum version in hacs.json.
          - name: "2026.2"
            python: "3.13"
            harness: "pytest-homeassistant-custom-component==0.13.316"
          - name: latest
            python: "3.14"
            harness: "pytest-homeassistant-custom-component"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv venv
      - run: uv pip install "${{ matrix.harness }}" aioresponses
      - run: .venv/bin/pytest -q
